name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 테스트 및 빌드 확인

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Check Formatting
        run: test -z "$(go fmt ./...)"

      # 컴파일은 되지만 위험할 수 있는 코드를 정적으로 검사하는 부분
      - name: Static Analysis
        run: go vet ./...

      - name: Run test
        run: go test -race -cover ./...

      - name: Build test
        run: |
          go build ./cmd/api
          go build ./cmd/worker
          go build ./cmd/seed