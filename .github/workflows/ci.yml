name: CI

on:

  push:
    branches:
      - 'issue#*'

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 테스트 및 빌드 확인

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      # 컴파일은 되지만 위험할 수 있는 코드를 정적으로 검사합니다.
      - name: Static analysis
        run: go vet ./...

      - name: Run tests
        run: go test -race -cover ./...

      - name: Build applications
        run: |
          go build ./cmd/api
          go build ./cmd/worker
          go build ./cmd/seed